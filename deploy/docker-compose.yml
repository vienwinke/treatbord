# ============================================================
# Treatbord 生产编排：nginx + app + mysql + redis（+ 可选 prometheus）
#   启动： docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   校验： docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
#   监控： docker compose ... --profile monitoring up -d
# 说明：app 只在内网暴露，外部流量必须经 nginx（HTTPS 终结）
# ============================================================
name: treatbord

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DB:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${APP_IMAGE:-treatbord/app:local}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      # --- 数据库（容器内网名）---
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_MIGRATE_USER: ${MYSQL_MIGRATE_USER:?}
      MYSQL_MIGRATE_PASSWORD: ${MYSQL_MIGRATE_PASSWORD:?}
      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # --- 安全密钥（生产必填，StartupValidator 会校验）---
      JWT_SECRET: ${JWT_SECRET:?}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?}
      STORAGE_SIGN_SECRET: ${STORAGE_SIGN_SECRET:?}
      # --- 微信（生产必须真实）---
      WX_APPID: ${WX_APPID:?}
      WX_SECRET: ${WX_SECRET:?}
      WX_LOGIN_ENABLED: "true"
      CONTENT_CHECK_ENABLED: "true"
      # --- 存储 ---
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:?}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # --- 反向代理：只有来自这些网段的 X-Forwarded-For 才被信任（否则限流会把所有用户当成同一 IP）---
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - uploads:/app/uploads
    networks: [backend]
    # 注意：不发布端口 —— 外部只能经 nginx 访问（HTTP 明文入口全部关闭）

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./nginx/treatbord.conf.template:/etc/nginx/templates/treatbord.conf.template:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/snippets/proxy_headers.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    networks: [backend]

  prometheus:
    # 建议首次拉取成功后固定到具体版本（当前环境无法验证 Docker Hub tag，故先用 latest）
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on: [app]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]

volumes:
  mysql-data:
  redis-data:
  uploads:
  nginx-cache:
  nginx-logs:
  prometheus-data:

networks:
  backend:
    driver: bridge
