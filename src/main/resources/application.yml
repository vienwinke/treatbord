# ============================================================
# Treatbord 应用配置（通用部分）
# 环境差异见 application-dev.yml / application-prod.yml
# 密钥一律通过环境变量注入，禁止写死入库（docs/SECURITY_REVIEW.md D3）
# ============================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: treatbord
  # 默认 dev；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# ---------- 业务通用配置 ----------
treatbord:
  jwt:
    expire-seconds: 604800        # 7 天
    issuer: treatbord
  storage:
    # 存储类型：local（开发）/ oss（生产），见各环境配置
    type: ${STORAGE_TYPE:local}

# ---------- OpenAPI ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true

# ---------- 健康检查 ----------
management:
  endpoint:
    health:
      show-details: never

# ---------- 日志（traceId 贯穿请求） ----------
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n"