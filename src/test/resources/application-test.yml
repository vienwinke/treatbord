# ============================================================
# 测试环境配置（@ActiveProfiles("test")）
# 使用独立测试库 treatbord_test，绝不动演示库
# 运行方式：set -a && source .env.local && set +a && mvn -s settings-mirror.xml test
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:treatbord_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:app_user}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      pool-name: TreatbordTestHikari

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:treatbord_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    user: ${MYSQL_MIGRATE_USER:db_migrate}
    password: ${MYSQL_MIGRATE_PASSWORD:}
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

treatbord:
  observability:
    slow-api-ms: 500
    slow-sql-ms: 300
  jwt:
    secret: ${JWT_SECRET:test-only-secret-key-0123456789-abcdefghij}
    expire-seconds: 604800
    issuer: treatbord
  storage:
    type: local
    local-dir: ${STORAGE_LOCAL_DIR:./target/test-uploads}
    base-url: http://127.0.0.1:8080/files
    sign-secret: ${STORAGE_SIGN_SECRET:test-sign-secret}
    signed-url:
      required: false              # 默认不强制；签名校验用例单独覆盖为 true
      ttl-seconds: 1800
  wx:
    enabled: false
    # 回调验签用的测试 Token（测试里据此自己算签名）
    message-push-token: test-msg-push-token
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    password-pepper: ${PASSWORD_PEPPER:test-pepper}
    content-check-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: warn
    com.treatbord: warn
