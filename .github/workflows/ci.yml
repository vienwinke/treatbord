name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: treatbord_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DB: treatbord_test
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_MIGRATE_USER: root
          MYSQL_MIGRATE_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-only-secret-key-0123456789-abcdefghij
          PASSWORD_PEPPER: ci-only-pepper
        run: mvn -B verify

  deploy:
    name: Deploy artifacts (image + nginx + compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 编排文件语法与变量插值校验（不启动容器）
      - name: Validate docker-compose
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q

      # 2) 渲染 Nginx 模板并校验语法（证书用自签占位；upstream 名 app 指向本机以便解析）
      - name: Prepare dummy certs
        run: |
          mkdir -p deploy/certs deploy/certbot-www
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.com" \
            -keyout deploy/certs/privkey.pem -out deploy/certs/fullchain.pem 2>/dev/null

      - name: Validate nginx config
        run: |
          docker run --rm --add-host app:127.0.0.1 \
            -e DOMAIN=example.com \
            -v "$PWD/deploy/nginx/treatbord.conf.template:/etc/nginx/templates/treatbord.conf.template:ro" \
            -v "$PWD/deploy/nginx/proxy_headers.conf:/etc/nginx/snippets/proxy_headers.conf:ro" \
            -v "$PWD/deploy/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

      # 3) 真实构建后端镜像（验证 Dockerfile 可用）
      - name: Build backend image
        run: docker build -f deploy/Dockerfile -t treatbord/app:ci .

      - name: Inspect image
        run: |
          docker image inspect treatbord/app:ci --format \
            '"'"'镜像大小={{.Size}} 健康检查={{if .Config.Healthcheck}}已配置{{else}}缺失{{end}} 运行用户={{.Config.User}}'"'"' 
